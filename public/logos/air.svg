  <polygon points="60,25 63,33 72,33 65,38 67,46 60,41 53,46 55,38 48,33 57,33" fill="url(#air-gold)" />
  <!-- Text Label -->
  <path id="air-text-path" d="M 24 92 Q 60 108 96 92" fill="none" />
  <text font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#ffffff" letter-spacing="1.5">
