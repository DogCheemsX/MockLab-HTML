  </defs>
  <!-- Outer Shield Circle -->
  <circle cx="60" cy="60" r="56" fill="#0f172a" stroke="url(#air-bg)" stroke-width="4" />
  <circle cx="60" cy="60" r="48" fill="url(#air-bg)" />
