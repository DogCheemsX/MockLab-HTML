<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="comsats-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#comsats-bg)" stroke="url(#gold-grad)" stroke-width="4" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2" />
  <!-- Atom Orbits -->
  <ellipse cx="60" cy="60" rx="36" ry="12" fill="none" stroke="url(#gold-grad)" stroke-width="2" transform="rotate(30 60 60)" />
  <ellipse cx="60" cy="60" rx="36" ry="12" fill="none" stroke="url(#gold-grad)" stroke-width="2" transform="rotate(-30 60 60)" />
  <ellipse cx="60" cy="60" rx="36" ry="12" fill="none" stroke="url(#gold-grad)" stroke-width="2" transform="rotate(90 60 60)" />
  <!-- Center Crescent & Star -->
  <path d="M 52 42 A 16 16 0 1 0 74 66 A 14 14 0 1 1 52 42 Z" fill="#ffffff" />
  <polygon points="68,44 70,50 76,50 71,54 73,60 68,56 63,60 65,54 60,50 66,50" fill="url(#gold-grad)" />
  <!-- Text Label -->
  <path id="text-path" d="M 22 60 A 38 38 0 0 1 98 60" fill="none" />
  <text font-family="Arial, sans-serif" font-weight="900" font-size="8.5" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#text-path" startOffset="50%" text-anchor="middle">COMSATS</textPath>
  </text>
</svg>
