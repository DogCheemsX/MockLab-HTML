<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pieas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pieas-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Outer Shield Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#pieas-bg)" stroke="url(#pieas-gold)" stroke-width="4" />
  <!-- Atomic Nucleus Ring -->
  <circle cx="60" cy="60" r="10" fill="url(#pieas-gold)" />
  <ellipse cx="60" cy="60" rx="38" ry="14" fill="none" stroke="#a78bfa" stroke-width="2.5" transform="rotate(45 60 60)" />
  <ellipse cx="60" cy="60" rx="38" ry="14" fill="none" stroke="#a78bfa" stroke-width="2.5" transform="rotate(-45 60 60)" />
  <!-- Open Book Symbol -->
  <path d="M 40 76 Q 60 68 80 76 L 80 84 Q 60 76 40 84 Z" fill="#ffffff" opacity="0.9" />
  <path d="M 60 70 L 60 81" stroke="#4c1d95" stroke-width="2" />
  <!-- Top Star -->
  <polygon points="60,20 62.5,27 70,27 64,31 66,38 60,33 54,38 56,31 50,27 57.5,27" fill="url(#pieas-gold)" />
  <!-- Text Label -->
  <path id="pieas-text-path" d="M 22 60 A 38 38 0 0 1 98 60" fill="none" />
  <text font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#ffffff" letter-spacing="2">
    <textPath href="#pieas-text-path" startOffset="50%" text-anchor="middle">PIEAS</textPath>
  </text>
</svg>
